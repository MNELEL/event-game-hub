name: edge-function-tests

permissions:
  contents: read

on:
  push:
    paths:
      - "supabase/functions/**"
      - ".github/workflows/edge-function-tests.yml"
  pull_request:
    paths:
      - "supabase/functions/**"
      - ".github/workflows/edge-function-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ─── Pure unit tests — always run, no DB required ───────────────────────────
  unit-tests:
    name: unit (logic only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x
      - name: Run logic unit tests
        run: |
          deno test \
            --allow-net --allow-env \
            supabase/functions/yemot-ivr/logic_test.ts

  # ─── Integration tests — REQUIRE DB secrets, fail loudly if missing ─────────
  integration-tests:
    name: integration (vs Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Set REQUIRE_DB=1 so tests assert the secrets are present and never silently skip.
      REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Verify required secrets are configured
        run: |
          missing=0
          if [ -z "${SUPABASE_URL}" ]; then
            echo "::error::Missing required secret SUPABASE_URL. Add it under Settings → Secrets and variables → Actions."
            missing=1
          fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::Missing required secret SUPABASE_SERVICE_ROLE_KEY. Add it under Settings → Secrets and variables → Actions."
            missing=1
          fi
          if [ "$missing" = "1" ]; then exit 1; fi
          echo "Both secrets present — running integration tests against the live DB."

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Run join_phone_player integration tests
        run: |
          deno test \
            --allow-net --allow-env \
            supabase/functions/yemot-ivr/join_phone_player_test.ts
